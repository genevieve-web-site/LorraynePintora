<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Netlify Forms Mirror</title>
  </head>
  <body>
    <form
      name="receber-ajuda"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="receber-ajuda" />
      <input type="hidden" name="bot-field" />
      <input type="text" name="nome" />
      <input type="text" name="endereco" />
      <input type="tel" name="whatsapp" />
      <textarea name="historia"></textarea>
    </form>

    <form
      name="ser-parceiro"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="ser-parceiro" />
      <input type="hidden" name="bot-field" />
      <input type="text" name="nome-empresa" />
      <select name="tipo-ajuda"></select>
      <input type="tel" name="whatsapp" />
      <textarea name="contribuicao"></textarea>
    </form>
  </body>
</html>
